<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Operation Xiong Di Qian — IALS Owner Brief</title><link rel="stylesheet" href="../assets/brand.css"><link rel="icon" href="../assets/ials-warbird.svg" type="image/svg+xml"><style>body{background:#020b11;color:#e7eef2}.wrap{max-width:1080px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}.head img{width:min(210px,44vw)}.actions{display:flex;gap:8px;flex-wrap:wrap}.hero,.card,.next{border:1px solid #314b5b;background:#061722;border-radius:16px;padding:20px;margin-top:14px}.hero{background:linear-gradient(135deg,#111b21,#06131b 60%,#171107)}.hero h1{font-size:clamp(42px,8vw,78px);line-height:.92;margin:10px 0}.hero h1 span,.gold{color:#efc66b}.pill{display:inline-block;border:1px solid #d8aa4a;background:#221807;color:#f1cd78;border-radius:999px;padding:7px 11px;font-weight:900;font-size:11px;letter-spacing:.08em}.bar{height:15px;background:#020b11;border:1px solid #263c49;border-radius:999px;overflow:hidden;margin:18px 0 7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8b651f,#e9bd5e);width:0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.kpi{border:1px solid #314b5b;background:#061722;border-radius:12px;padding:14px}.kpi b{display:block;font-size:28px;color:#efc66b}.kpi span{font-size:10px;color:#9fb1bc;text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{padding:9px 0;border-bottom:1px solid #17303d}.item:last-child{border-bottom:0}.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.part{border:1px solid #d8aa4a;background:#0b1419;border-radius:12px;padding:16px}.part b{font-size:24px;color:#efc66b}.part strong{display:block;font-size:38px}.next{border:2px solid #d8aa4a;background:linear-gradient(135deg,#171206,#07151c)}.next h2{color:#efc66b}.foot{font-size:11px;color:#879aa4;margin:18px 0 40px}@media(max-width:760px){.head{display:block}.actions{margin-top:10px}.kpis{grid-template-columns:1fr 1fr}.grid,.parts{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="head"><a href="../index.html"><img src="../assets/ials-warbird.svg" alt="IALS"></a><div class="actions"><button class="btn gold" id="speak">🔊 Listen to Brief</button><a class="btn dark" href="../admin.html">Command Center</a><a class="btn ghost" href="../index.html">IALS Site</a></div></header><main id="root" class="card">Loading owner deal brief…</main><div class="foot">Read-only owner view. This page shows workflow status only. Final pricing, compliance approval and shipment release remain human-controlled.</div></div><script>(()=>{const root=document.getElementById('root'),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let data=null;const rows=(a,mark)=>a.map(x=>`<div class="item"><b class="gold">${mark}</b> ${esc(x)}</div>`).join('');async function load(){try{const r=await fetch('xiong-di-qian-status.json?v='+Date.now(),{cache:'no-store'});data=await r.json();const pct=Math.round(data.progress.completed/data.progress.total*100);root.className='';root.innerHTML=`<section class="hero"><span class="pill">${esc(data.status)}</span><span class="eyebrow" style="display:block;margin-top:16px">Owner deal mission control</span><h1>${esc(data.operation)}<br><span>LIVE DEAL BRIEF.</span></h1><p class="lead">${esc(data.statusNote)}</p><div class="bar"><i id="pbar"></i></div><div class="subtle">${esc(data.progress.label)} · ${pct}% workflow progress · Last verified ${esc(data.lastVerified)}</div></section><section class="kpis"><div class="kpi"><b>${data.parts.reduce((s,p)=>s+Number(p.qty||0),0)}</b><span>Units requested</span></div><div class="kpi"><b>${data.parts.length}</b><span>Part-number lanes</span></div><div class="kpi"><b>${data.completed.length}</b><span>Stages complete</span></div><div class="kpi"><b>${data.pending.length}</b><span>Open actions</span></div></section><section class="card"><span class="eyebrow">The requirement</span><h2>What the buyer wants</h2><div class="parts">${data.parts.map(p=>`<div class="part"><b>${esc(p.pn)}</b><strong>× ${esc(p.qty)}</strong><span class="tag">${esc(p.state)}</span>${p.note?`<small class="subtle">${esc(p.note)}</small>`:''}</div>`).join('')}</div></section><div class="grid"><section class="card"><span class="eyebrow">Already done</span><h2>Completed</h2>${rows(data.completed,'✓')}</section><section class="card"><span class="eyebrow">What blocks money</span><h2>Open gates</h2>${rows(data.pending,'→')}</section></div><div class="grid"><section class="card"><span class="eyebrow">Mario / Elmo lane</span><h2>What you can do now</h2>${rows(data.ownerActions,'→')}</section><section class="card"><span class="eyebrow">Communications</span><h2>Deal traffic</h2>${data.communications.map(c=>`<div class="item"><b class="gold">${esc(c.state)}</b><br><strong>${esc(c.label)}</strong><div class="subtle">${esc(c.detail)}</div></div>`).join('')}</section></div><section class="next"><span class="eyebrow">Best next move</span><h2>Keep both sides moving.</h2><p>${esc(data.nextBestMove)}</p></section>`;requestAnimationFrame(()=>document.getElementById('pbar').style.width=pct+'%')}catch(e){root.textContent='Status feed unavailable. Open the IALS Command Center for the latest brief.'}}document.getElementById('speak').onclick=()=>{if(!data||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`${data.operation}. ${data.status}. ${data.progress.label}. ${data.nextBestMove}`);u.rate=.93;speechSynthesis.speak(u)};load()})()</script></body></html>
